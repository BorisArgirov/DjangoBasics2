{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <h1 class="mt-4">Create Book</h1>
        <form method="post" class="mt-4">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group mt-4">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button class="btn btn-primary">Create</button>
        </form>
    </div>
{% endblock %}
