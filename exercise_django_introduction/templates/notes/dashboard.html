<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'list-categories' %}">Categories</a>
    </nav>

    <form>
        <input name="q" placeholder="Search Notes">
        <button>Submit</button>
    </form>
    {% for note in notes %}
        <h2>{{ note.title }}</h2>
        <p>{{ note.body }}</p>
    {% empty %}
        <h1>No notes.</h1>
    {% endfor %}
</body>
</html>
